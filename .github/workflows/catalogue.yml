name: Synchroniser Discord et publier le catalogue web

on:
  schedule:
    # Vérification intégrale chaque jour à 18 h, heure de Paris, été comme hiver.
    - cron: '0 18 * * *'
      timezone: "Europe/Paris"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sync_catalogue.py'
      - 'catalogue_v2.py'
      - 'dashboard_unique.py'
      - 'export_catalogue.py'
      - 'site_monitor.py'
      - 'server_link_watch.py'
      - 'forum_updates.py'
      - 'forum_cards.py'
      - 'tests/test_server_link_watch.py'
      - 'tests/test_forum_updates.py'
      - 'thread_watch.py'
      - 'mirror_watch.py'
      - 'discord_endpoint_setup.py'
      - 'api/**'
      - 'tests/test_discord_interactions.mjs'
      - 'tests/test_discord_endpoint_setup.py'
      - 'site_discovery.py'
      - 'tests/test_site_discovery.py'
      - 'name_probe.py'
      - 'tests/test_name_probe.py'
      - 'tests/test_mirror_watch.py'
      - 'tests/test_thread_watch.py'
      - 'site_probe.py'
      - 'tests/test_site_monitor.py'
      - 'tests/test_dashboard_unique.py'
      - 'site/**'
      - 'tests/test_web_export.py'
      - 'tests/test_website.py'
      - '.github/workflows/catalogue.yml'

concurrency:
  group: elikto-catalogue
  cancel-in-progress: false

jobs:
  synchroniser:
    name: Synchroniser Discord et publier le site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dependances
        run: python -m pip install -r requirements.txt
      - name: Tester le projet
        run: python -m unittest discover -s tests -v
      - name: Verifier le JavaScript du site
        run: node --check site/app.js
      - name: Tester le menu Discord
        run: node --test tests/test_discord_interactions.mjs
      - name: Synchroniser les forums Discord et exporter les fiches publiques
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          TEAMFLIX_LOGIN_USERNAME: ${{ secrets.TEAMFLIX_LOGIN_USERNAME }}
          TEAMFLIX_LOGIN_PASSWORD: ${{ secrets.TEAMFLIX_LOGIN_PASSWORD }}
          DISCORD_GUILD_ID: '1430984645012357263'
          EXCLUDED_CHANNEL_IDS: ${{ vars.EXCLUDED_CHANNEL_IDS }}
        run: python sync_catalogue.py
      - name: Récupérer le dernier état persistant
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mkdir -p data
          if git cat-file -e origin/main:data/monitor_state.json 2>/dev/null; then
            git show origin/main:data/monitor_state.json > data/monitor_state.json
            echo "Dernier état historique récupéré"
          else
            echo "Première surveillance, aucun historique distant"
          fi
      - name: Valider la connexion Discord au menu déroulant
        id: discord_dropdown
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_PUBLIC_KEY_EXPECTED: 'c9a3ec70eab0c06fcfc203e8c733a44098f3241de9c660467a7f0c9ecac53d5f'
          DISCORD_INTERACTIONS_ENDPOINT: 'https://elikto-discord-interactions.vercel.app/api/discord-interactions'
        run: python discord_endpoint_setup.py
      - name: Vérifier quotidiennement toutes les URL du fil Streaming HD miroir
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          # 1 uniquement si Discord a confirmé l'endpoint signé :
          # aucun menu inutilisable n'est publié en cas d'échec.
          DISCORD_MIRROR_DROPDOWN_ENABLED: ${{ steps.discord_dropdown.outputs.enabled }}
          FORCE_DAILY_INTEGRITY_SCAN: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python mirror_watch.py
      - name: Recenser et vérifier quotidiennement tous les liens des salons et forums publics
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1430984645012357263'
          EXCLUDED_CHANNEL_IDS: ${{ vars.EXCLUDED_CHANNEL_IDS }}
          # Observation de l'annuaire par capture du 18/11/2026 :
          # candidats seulement, JAMAIS considérés vérifiés sans sonde HTML.
          # Les catégories de l'annuaire en ligne restent prioritaires.
          FLEMMIX_OBSERVED_MAIN: 'https://flemmix.uno/'
          FLEMMIX_FAI_BLOCKED_HOSTS: 'wiflix.red,flemmix.men,flemmix.wales,flemmix.vip,flemmix.casa,flemmix.prof,wiflix.re,flemmix.cafe'
          FORCE_DAILY_INTEGRITY_SCAN: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python server_link_watch.py
      - name: Surveiller les sites publics et alimenter l'historique
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1430984645012357263'
          FORCE_DAILY_INTEGRITY_SCAN: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python site_monitor.py
      - name: Verifier le catalogue web genere
        run: |
          python -c "import json; d=json.load(open('site/catalogue.json', encoding='utf-8')); assert d['visibility']=='public_everyone_only'; assert len(d['categories'])>0; print('Fiches publiques:', d['stats']['entries'])"
          python -c "import json; m=json.load(open('site/monitoring.json',encoding='utf-8')); assert m['total']>0; print('Sites sous surveillance:',m['monitored'],'/',m['total'])"
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparer le contenu du site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Conserver l'historique entre les exécutions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monitor_state.json
          if ! git diff --staged --quiet; then
            git commit -m "Données de surveillance : mise à jour automatique [skip ci]"
            # Les JSON du site sont deja deployes dans l'artifact Pages.
            # Restaurer ces modifications de la copie de travail pour rebaser.
            git restore -- site/catalogue.json
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
            echo "Historique enregistré dans data/monitor_state.json"
          else
            echo "Historique inchangé"
          fi
      - name: Mettre le catalogue en ligne
        id: deployment
        uses: actions/deploy-pages@v4

